name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2fa8f5515d1defb21584c311516e87f1ef550f55" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore and Environment
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest assembleDebug --no-daemon --no-configuration-cache --stacktrace --info
          else
            gradle testDebugUnitTest assembleDebug --no-daemon --no-configuration-cache --stacktrace --info
          fi

      - name: Stage release APK
        run: |
          mkdir -p release-assets
          # Prefer the universal/debug APK; fall back to any produced debug APK.
          APK=$(ls app/build/outputs/apk/debug/*-debug.apk 2>/dev/null | head -n1 || true)
          if [ -z "$APK" ]; then
            APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "No debug APK found under app/build/outputs/apk/debug/"
            ls -laR app/build/outputs/apk || true
            exit 1
          fi
          cp "$APK" "release-assets/Hollow-debug.apk"
          echo "Staged APK: $APK -> release-assets/Hollow-debug.apk"
          ls -la release-assets/

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hollow-Unit-Test-Reports
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hollow-debug.apk
          path: release-assets/Hollow-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        uses: ncipollo/release-action@v1
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          artifacts: "release-assets/Hollow-debug.apk"
          artifactContentType: application/vnd.android.package-archive
          tag: "latest"
          name: "Hollow Latest APK Release"
          body: "Auto-generated Hollow LSPosed Module APK for commit ${{ github.sha }}"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
